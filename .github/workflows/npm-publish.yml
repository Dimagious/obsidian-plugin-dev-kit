name: npm publish

# Publishes the tagged version to npm through trusted publishing (OIDC): no token is stored in the repository, and npm
# adds a provenance statement that ties the package to this workflow and commit. Tag the commit on main that CI passed.
# A version that is already on npm is skipped, so the first version, published by hand before trusted publishing could
# be configured, leaves this run green.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Compare tag with package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version (expected v$version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip a version that is already on npm
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "obsidian-plugin-dev-kit@$VERSION" version >/dev/null 2>&1; then
            echo "obsidian-plugin-dev-kit@$VERSION is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Dependencies' install scripts do not run in the job that holds the publish credential. `npm publish` still runs
      # the kit's own `prepare`, which builds dist/.
      - if: steps.published.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - if: steps.published.outputs.skip != 'true'
        run: npm install -g npm@11.5.1
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
