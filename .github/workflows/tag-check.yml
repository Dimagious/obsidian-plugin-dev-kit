name: Tag check

# Fails when a pushed tag does not match package.json. Does not publish or create a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tag-matches-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compare tag with package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version (expected v$version)." >&2
            exit 1
          fi
