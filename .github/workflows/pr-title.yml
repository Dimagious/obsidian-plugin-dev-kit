name: PR title

# Pull requests are squash-merged, so the title becomes the commit on main.
# It has to be a Conventional Commit: <type>(<scope>)!: <summary>.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        # The title is untrusted input: it reaches the script only through env.
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^A-Z].*[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title is not a Conventional Commit: $TITLE" >&2
            echo "Expected <type>(<scope>): <summary>, e.g. 'fix(build): keep styles.css when there is no src/styles'." >&2
            echo "Types: feat fix docs refactor perf test build ci chore revert. Summary starts lowercase, no trailing period. See CONTRIBUTING.md." >&2
            exit 1
          fi
          # Dependabot writes its own titles ("bump <long package name> from x to y"); only the format applies to it.
          if [ "$AUTHOR" != "dependabot[bot]" ] && [ "${#TITLE}" -gt 72 ]; then
            echo "PR title is ${#TITLE} characters; keep it at 72 or fewer." >&2
            exit 1
          fi
          echo "ok: $TITLE"
