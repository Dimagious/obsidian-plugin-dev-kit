name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned: on 2026-11-11 the ubuntu-latest image (26.04 "resolute") could not resolve the Ubuntu archive, so apt hung
    # until the job timed out. Move to the next LTS on purpose, not by the alias.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci does not fetch the Electron binary here (the package downloads it on first use), and the phone-layout
      # tests need it. Cached by lockfile so the ~100 MB download happens once per Electron version.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      # The demo tests run the real ffmpeg and render the phone layout in a hidden Electron window, which needs a
      # display (xvfb). On CI they fail, not skip, when ffmpeg is missing.
      - name: Install ffmpeg and xvfb
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth
      # Lints the workflows, the reusable ones included. A pinned release, not curl | sh: the archive is checked against a
      # SHA-256 before it is unpacked. Bump version and checksum together (the checksum is in the release's
      # actionlint_<version>_checksums.txt); Dependabot does not update it.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        # Chromium's sandbox cannot start on the runner (no SUID helper, restricted user namespaces); see NO_SANDBOX_ENV.
        env:
          OPDK_COMPOSE_NO_SANDBOX: "1"
        run: xvfb-run -a npm test
      - run: npm run build
      # Checks the Claude Code marketplace and plugin manifests and the skills; no model calls, no credentials.
      # Pinned to an exact version, published at least 7 days before it was chosen, so a new Claude Code release
      # cannot turn CI red by itself. Dependabot does not bump this pin: update it by hand.
      - name: Validate the Claude Code plugin
        env:
          DISABLE_TELEMETRY: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.318
          npm run plugin:validate
      - name: Pack and install smoke
        run: npm run smoke
