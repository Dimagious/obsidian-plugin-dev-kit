name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci does not fetch the Electron binary here (the package downloads it on first use), and the phone-layout
      # tests need it. Cached by lockfile so the ~100 MB download happens once per Electron version.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      # The demo tests run the real ffmpeg and render the phone layout in a hidden Electron window, which needs a
      # display (xvfb). On CI they fail, not skip, when ffmpeg is missing.
      - name: Install ffmpeg and xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        # Chromium's sandbox cannot start on the runner (no SUID helper, restricted user namespaces); see NO_SANDBOX_ENV.
        env:
          OPDK_COMPOSE_NO_SANDBOX: "1"
        run: xvfb-run -a npm test
      - run: npm run build
      - name: Pack and install smoke
        run: npm run smoke
